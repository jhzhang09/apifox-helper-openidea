[package]
name = "apifox-helper-openidea"
version = "0.1.13"
edition = "2024"
description = "OpenIDEA 的 Apifox 接口文档、同步和调试插件"
license = "Apache-2.0"
repository = "https://github.com/jhzhang09/apifox-helper-openidea"
readme = "README.md"
rust-version = "1.100"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { path = "vendor/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
yaml-rust2 = { version = "=0.8.1", default-features = false }

[dev-dependencies]
toml = "0.9"

[profile.release]
lto = true
opt-level = "s"
strip = true
