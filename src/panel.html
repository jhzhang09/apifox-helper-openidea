<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --base: #f7f8fa;
        --surface: #fff;
        --ink: #263247;
        --muted: #667185;
        --line: #dce1e8;
        --accent: #cf3656;
        --focus: #3374c9;
        font:
          12px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --base: #25282f;
          --surface: #2c3039;
          --ink: #e1e5ed;
          --muted: #a2adbd;
          --line: #434a56;
          --accent: #fa7893;
          --focus: #6ca8f5;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--base);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 650;
      }
      h1 span {
        color: var(--accent);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        padding: 7px;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--focus);
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
      }
      .bar select {
        flex: 1;
      }
      .bar input {
        flex: 1 1 100%;
      }
      main {
        padding: 0 12px 12px;
      }
      .hint {
        color: var(--muted);
        line-height: 1.6;
        font-size: 11px;
      }
      .status {
        max-height: 8rem;
        overflow: auto;
        padding: 9px 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-bottom: 1px solid var(--line);
      }
      .error {
        color: var(--accent);
      }
      .list {
        overflow-y: auto;
        overflow-x: hidden;
        border-bottom: 1px solid var(--line);
        scrollbar-gutter: stable;
      }
      .verb {
        font:
          10px ui-monospace,
          SFMono-Regular,
          monospace;
        color: var(--focus);
        font-weight: 700;
      }
      .route {
        font:
          11px ui-monospace,
          SFMono-Regular,
          monospace;
      }
      nav {
        display: flex;
        gap: 4px;
        margin: 12px 0;
      }
      nav button[aria-selected="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      pre {
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          monospace;
        overflow: auto;
        max-height: 44vh;
        padding: 9px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        tab-size: 2;
      }
      details {
        margin: 8px 0;
      }
      summary {
        cursor: pointer;
        padding: 6px 0;
      }
      .model {
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          monospace;
        padding-left: 12px;
        border-left: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .field {
        margin: 4px 0;
      }
      .type {
        color: var(--focus);
      }
      .desc {
        color: var(--muted);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .form {
        display: grid;
        gap: 9px;
      }
      .form label {
        display: grid;
        gap: 4px;
      }
      .form textarea {
        min-height: 85px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        width: 100%;
      }
      .form input,
      .form select {
        width: 100%;
      }
      .hidden {
        display: none !important;
      }
      .empty {
        padding: 26px 0;
        line-height: 1.8;
        color: var(--muted);
      }
      .tree-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 9px 0;
      }
      .tree-toolbar span {
        margin-left: auto;
        color: var(--muted);
      }
      .diagnostics {
        padding: 6px 12px;
        margin: 0;
        border-bottom: 1px solid var(--line);
      }
      .diagnostic-list {
        max-height: 11rem;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 0 0 0 18px;
        line-height: 1.6;
      }
      .diagnostic-list li {
        margin: 5px 0;
      }
      :root {
        --selection: #e9eef7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --selection: #344153;
        }
      }
      .tree-toolbar {
        flex-wrap: wrap;
      }
      .tree-control {
        padding: 3px 5px;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 11px;
      }
      .list {
        max-height: 46vh;
        min-height: 130px;
        position: relative;
      }
      .tree-columns,
      .api-tree-row {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 8px;
        min-width: 0;
        width: 100%;
        align-items: center;
      }
      .tree-columns {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--surface);
        padding: 8px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .tree-columns > span + span {
        border-left: 1px solid var(--line);
        padding-left: 8px;
      }
      .api-tree-node {
        margin: 0;
        min-width: 0;
        width: 100%;
      }
      .tree-children {
        min-width: 0;
        width: 100%;
      }
      .api-tree-row {
        --tree-depth: 0;
        min-height: 30px;
        padding: 3px 8px;
        border: 0;
        cursor: pointer;
      }
      .api-tree-row:hover {
        background: var(--selection);
      }
      .group-row {
        list-style: none;
        grid-template-columns: minmax(0, 1fr);
      }
      .group-row::-webkit-details-marker {
        display: none;
      }
      .tree-name {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
        max-width: 100%;
        padding-inline-start: calc(var(--tree-depth) * 12px);
      }
      .tree-label,
      .endpoint-title {
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      .tree-label {
        flex: 0 1 auto;
      }
      .tree-count {
        line-height: 1.5;
        color: var(--muted);
        flex-shrink: 0;
      }
      .tree-chevron,
      .tree-spacer {
        display: inline-block;
        flex: 0 0 10px;
        width: 10px;
        color: var(--muted);
        font-size: 19px;
        line-height: 20px;
      }
      .tree-chevron {
        transition: transform 0.1s;
      }
      .api-tree-node[open] > .group-row .tree-chevron {
        transform: rotate(90deg);
      }
      .folder-icon {
        flex: 0 0 18px;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        color: var(--muted);
      }
      .folder-icon.module rect,
      .folder-icon.root {
        color: var(--focus);
      }
      .folder-icon.module rect {
        fill: var(--surface);
      }
      .folder-icon.package circle {
        fill: currentColor;
        stroke: none;
      }
      .endpoint-title,
      .tree-path {
        padding: 3px 0;
        border: 0;
        background: transparent;
        text-align: left;
        border-radius: 0;
        min-width: 0;
        color: inherit;
      }
      .endpoint-title {
        font-size: 12px;
        flex: 1;
      }
      .tree-path {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        max-width: 100%;
        line-height: 1.5;
      }
      .tree-path .verb {
        flex-shrink: 0;
        line-height: 1.65;
      }
      .tree-path .route {
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      .is-active {
        background: var(--selection);
        box-shadow: inset 3px 0 var(--accent);
      }
      .is-active .endpoint-title {
        font-weight: 600;
      }
      @media (prefers-reduced-motion: reduce) {
        .tree-chevron {
          transition: none;
        }
      }
      .context-menu {
        position: fixed;
        z-index: 20;
        min-width: 220px;
        max-width: calc(100vw - 8px);
        padding: 5px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: 0 8px 24px #0003;
      }
      .context-menu button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 9px 12px;
      }
      .context-menu button:hover,
      .context-menu button:focus-visible {
        background: var(--selection);
      }
      .context-label {
        font-size: 11px;
        color: var(--muted);
        padding: 5px 12px 7px;
        max-width: 310px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border-bottom: 1px solid var(--line);
        margin-bottom: 3px;
      }
      .tree-help {
        display: block;
        margin: 0;
        padding: 9px 0 2px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .scan-bar {
        flex-wrap: nowrap;
        align-items: center;
      }
      .scan-bar input {
        flex: 1 1 auto;
        width: 0;
      }
      .scan-bar button {
        flex: 0 0 auto;
      }
      .project-field {
        position: relative;
        display: grid;
        gap: 5px;
        min-width: 0;
      }
      .project-trigger {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 9px 11px;
      }
      .project-current,
      .project-option-labels {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        flex: 1;
      }
      .project-current > span,
      .project-option-labels > span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .project-meta {
        font-size: 11px;
        color: var(--muted);
        font-weight: 400;
      }
      .project-arrow {
        color: var(--muted);
        flex: 0 0 auto;
      }
      .project-trigger[aria-expanded="true"] {
        border-color: var(--focus);
      }
      .project-picker {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        z-index: 12;
        padding: 7px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 5px;
        box-shadow: 0 8px 24px #0003;
      }
      .project-options {
        max-height: 230px;
        overflow: auto;
        margin-top: 5px;
      }
      .project-option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 8px;
        border-radius: 3px;
      }
      .project-option.is-highlighted,
      .project-option:hover {
        background: var(--selection);
      }
      .project-option-name {
        font-weight: 500;
      }
      .project-check {
        width: 14px;
        flex: 0 0 14px;
        color: var(--accent);
      }
      .project-picker #project-list-status {
        font-size: 11px;
        margin: 5px 7px;
      }
      .project-picker-footer {
        display: flex;
        justify-content: space-between;
        padding-top: 5px;
        border-top: 1px solid var(--line);
      }
      .project-picker-footer button {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 5px;
      }
      .project-manual {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding-top: 5px;
      }
      .project-manual label {
        flex: 1;
        min-width: 0;
      }
      .project-manual button {
        flex: 0 0 auto;
      }
      .project-field #project-change-status {
        margin: 2px 0;
        font-size: 11px;
      }
      @media (max-width: 480px) {
        .endpoint-row {
          grid-template-columns: minmax(0, 1fr);
          gap: 1px;
          padding-top: 5px;
          padding-bottom: 5px;
        }
        .endpoint-row .tree-path {
          padding-inline-start: calc(var(--tree-depth) * 12px + 16px);
          padding-bottom: 3px;
        }
        .tree-columns {
          grid-template-columns: minmax(0, 1fr);
        }
        .tree-columns > span:nth-child(2) {
          display: none;
        }
        .tree-columns > span:first-child::after {
          content: " / 路径";
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span>Apifox</span> Helper</h1>
      <button id="settings-toggle" aria-expanded="false">项目配置</button>
    </header>
    <div id="settings" class="hidden" style="padding: 12px">
      <div class="form">
        <p id="config-project" class="hint">
          配置按当前本地项目保存，保存后下次自动载入。
        </p>
        <div class="project-field" id="project-field">
          <span id="project-field-label">同步项目</span>
          <button
            id="project-trigger"
            class="project-trigger"
            type="button"
            aria-labelledby="project-field-label project-name project-meta"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="project-picker"
          >
            <span class="project-current"
              ><span id="project-name">选择 Apifox 项目</span
              ><span id="project-meta" class="project-meta"
                >点击选择</span
              ></span
            ><span aria-hidden="true" class="project-arrow">⌄</span>
          </button>
          <div
            id="project-picker"
            class="hidden project-picker"
            role="dialog"
            aria-label="选择同步项目"
          >
            <input
              id="project-filter"
              role="combobox"
              aria-label="搜索项目"
              aria-autocomplete="list"
              aria-expanded="true"
              aria-controls="project-choice"
              placeholder="搜索项目、团队或 ID"
              autocomplete="off"
            />
            <div
              id="project-choice"
              class="project-options"
              role="listbox"
              aria-label="可用项目"
            ></div>
            <p id="project-list-status" class="hint" role="status"></p>
            <div class="project-picker-footer">
              <button id="load-projects" type="button">刷新列表</button
              ><button id="project-manual-toggle" type="button">
                手动填写 ID
              </button>
            </div>
          </div>
          <div id="project-manual" class="hidden project-manual">
            <label
              >项目 ID<input
                id="project_id"
                inputmode="numeric"
                placeholder="输入项目 ID" /></label
            ><button id="project-manual-done" type="button">完成</button>
          </div>
          <p id="project-change-status" class="hint hidden" role="status"></p>
        </div>
        <label
          >接口目录 ID（留空为根目录）<input
            id="endpoint_folder"
            inputmode="numeric" /></label
        ><label
          >模型目录 ID（留空为根目录）<input
            id="schema_folder"
            inputmode="numeric" /></label
        ><label
          >分支 ID（留空为主分支）<input
            id="branch"
            inputmode="numeric" /></label
        ><label
          >模块 ID（留空为默认模块）<input
            id="module"
            inputmode="numeric" /></label
        ><label
          >已有文档的处理<select id="overwrite">
            <option value="AUTO_MERGE">自动合并</option>
            <option value="OVERWRITE_EXISTING">覆盖</option>
            <option value="KEEP_EXISTING">保留已有文档</option>
            <option value="CREATE_NEW">创建新文档</option>
          </select></label
        ><label>文档标题<input id="title" /></label
        ><label
          >调试服务地址<input id="base_url" placeholder="http://localhost:8080"
        /></label>
        <p id="token" class="hint"></p>
        <button id="save-config">保存项目配置</button>
      </div>
    </div>
    <div class="bar scan-bar">
      <input
        id="search"
        aria-label="筛选接口"
        placeholder="搜索模块、包、Controller、接口名称或路径"
      /><button id="scan" title="扫描整个项目的业务源码">扫描接口</button>
    </div>
    <div id="status" class="status" role="status">
      点击扫描接口，读取整个项目的业务源码（排除测试源码）。
    </div>
    <details id="diagnostics" class="diagnostics hidden">
      <summary id="diagnostic-summary"></summary>
      <ul id="diagnostic-list" class="diagnostic-list"></ul>
    </details>
    <div
      id="scan-time"
      class="hint hidden"
      role="status"
      style="padding: 0 16px"
    ></div>
    <main>
      <div class="tree-toolbar">
        <button id="expand-all" class="tree-control" title="展开所有节点">
          展开全部</button
        ><button id="collapse-all" class="tree-control" title="折叠到模块">
          折叠全部</button
        ><span id="count">0 个接口</span>
      </div>
      <div id="list" class="list">
        <div class="empty">
          从源码生成接口文档，先预览响应模型，再同步到 Apifox。
        </div>
      </div>
      <p class="hint tree-help">
        右键文件夹或接口上传、导出；双击接口跳转源码。
      </p>
      <nav aria-label="接口详情">
        <button data-tab="model" aria-selected="true">响应模型</button
        ><button data-tab="spec" aria-selected="false">OpenAPI</button
        ><button data-tab="debug" aria-selected="false">调试</button>
      </nav>
      <section id="model">
        <p class="hint">选择接口查看响应结构。循环引用保留为模型引用。</p>
      </section>
      <section id="spec" class="hidden"><pre id="json"></pre></section>
      <section id="debug" class="hidden">
        <div class="form">
          <label
            >HTTP 方法<select id="method">
              <option>GET</option>
              <option>POST</option>
              <option>PUT</option>
              <option>PATCH</option>
              <option>DELETE</option>
              <option>HEAD</option>
              <option>OPTIONS</option>
            </select></label
          ><label
            >请求 URL<input id="url" placeholder="替换路径参数后发送" /></label
          ><label
            >请求头（JSON 键值对象）<textarea id="headers">{}</textarea></label
          ><label>请求体<textarea id="body"></textarea></label
          ><button id="send">发送请求</button>
        </div>
        <pre id="response">尚未发送请求</pre>
      </section>
    </main>
    <div
      id="context-menu"
      class="context-menu hidden"
      role="menu"
      aria-label="接口操作"
    >
      <div id="context-label" class="context-label"></div>
      <button role="menuitem" data-action="upload">上传到 Apifox</button>
      <button role="menuitem" data-action="yaml">导出 OpenAPI (YAML)</button>
      <button role="menuitem" data-action="json">导出 OpenAPI (JSON)</button>
    </div>
    <script>
      "use strict";
      const INITIAL = "__APIFOX_CONFIG__";
      const $ = (id) => document.getElementById(id);
      const clientId =
        Date.now().toString(36) + Math.random().toString(36).slice(2);
      const projectStates = new Map();
      let projectRoot = null,
        requestSequence = 0,
        pendingId = null,
        contextId = null,
        contextSentAt = 0;
      let remoteProjects = [],
        filteredProjects = [],
        projectsLoaded = false,
        projectListMessage = "",
        pickerActive = -1,
        pendingAction = null,
        configDirty = false,
        result = null,
        scannedAtMs = null,
        snapshotSaved = false,
        activeKey = null,
        menuTarget = null,
        menuAnchor = null,
        config = {},
        busy = false,
        expanded = new Set(["root"]),
        treeSearch = "";
      const text = (tag, value, cls) => {
        const n = document.createElement(tag);
        n.textContent = value;
        if (cls) n.className = cls;
        return n;
      };
      function status(s, error = false) {
        $("status").textContent = s;
        $("status").classList.toggle("error", error);
      }
      function scanTime(cached) {
        const valid = Number.isFinite(scannedAtMs) && scannedAtMs > 0;
        $("scan-time").classList.toggle("hidden", !valid);
        $("scan-time").textContent = valid
          ? `${cached ? "上次扫描" : "扫描时间"}：${new Date(scannedAtMs).toLocaleString("zh-CN", { hour12: false })} · ${cached ? "已恢复缓存快照，源码可能已变化；" : ""}${snapshotSaved ? "" : "结果未保存；"}上传前自动重新扫描校验`
          : "";
      }
      function renderScan(value, time, saved, cached) {
        rememberExpansion();
        result = value;
        scannedAtMs = time ?? null;
        snapshotSaved = saved;
        activeKey = null;
        viewList(false);
        if (result.endpoints.length) show(0);
        diagnostics(result);
        scanTime(cached);
        status(
          `${cached ? "已恢复上次扫描，" : ""}识别到 ${result.endpoints.length} 个接口，${result.warnings.length} 条错误，${(result.notices || []).length} 条结构提示。`,
          result.warnings.length > 0,
        );
      }
      function restoreSnapshot(state) {
        const snapshot = state.snapshot;
        if (
          snapshot?.projectRoot === projectRoot &&
          (!result || snapshot.scannedAtMs > (scannedAtMs || 0))
        ) {

        if (field.id === "project-filter") continue;
        field.addEventListener("input", () => (configDirty = true));
        field.addEventListener("change", () => (configDirty = true));
      }
      function applyConfig(v) {
        config = v.config;
        configDirty = false;
        for (const [k, val] of Object.entries(config)) {
          if ($(k)) $(k).value = val ?? "";
        }
        $("token").textContent = v.tokenSet
          ? "Apifox 访问令牌已设置。"
          : "请在 Settings → Plugins → Apifox Helper → Secrets 中设置 Apifox Access Token。";
        const root = v.projectRoot || "";
        const label = root
          .replaceAll("\\", "/")
          .split("/")
          .filter(Boolean)
          .pop();
        $("config-project").textContent = label ? "本地项目：" + label : "";
        $("config-project").title = root;
        $("project-change-status").classList.add("hidden");
        projectCaption();
        renderProjects();
        if (v.message) status(v.message);
        if (
          !$("project-picker").classList.contains("hidden") &&
          !projectsLoaded &&
          !busy
        )
          refreshProjects();
      }
      $("save-config").onclick = () => {
        const next = {};
        for (const k of ["project_id", "title", "base_url", "overwrite"])
          next[k] = $(k).value.trim();
        for (const k of [
          "endpoint_folder",
          "schema_folder",
          "branch",
          "module",
        ]) {
          const s = $(k).value.trim();
          if (s && !/^\d+$/.test(s)) {
            status("目录、分支和模块 ID 必须是数字", true);
            return;
          }
          next[k] = s ? Number(s) : null;
        }
        const chosen = remoteProjects.find((p) => p.id === next.project_id);
        next.project_name =
          chosen?.name ||
          (config.project_id === next.project_id
            ? config.project_name || ""
            : "");
        next.team_name =
          chosen?.team_name ||
          (config.project_id === next.project_id ? config.team_name || "" : "");
        send({ op: "save-config", config: next });
      };
      function projectCaption() {
        const id = $("project_id").value.trim(),
          project = remoteProjects.find((p) => p.id === id);
        const name =
          project?.name ||
          (config.project_id === id ? config.project_name : "");
        const team =
          project?.team_name ||
          (config.project_id === id ? config.team_name : "");
        $("project-name").textContent =
          name || (id ? "项目 " + id : "选择 Apifox 项目");
        $("project-meta").textContent = id
          ? [team, "ID " + id].filter(Boolean).join(" · ")
          : "点击选择";
        $("project-trigger").title = [name, team, id ? "ID " + id : ""]
          .filter(Boolean)
          .join(" / ");
      }
      function highlightProject(index) {
        if (!filteredProjects.length) {
          pickerActive = -1;
          $("project-filter").removeAttribute("aria-activedescendant");
          return;
        }
        pickerActive =
          (index + filteredProjects.length) % filteredProjects.length;
        for (const option of $("project-choice").querySelectorAll(
          '[role="option"]',
        ))
          option.classList.toggle(
            "is-highlighted",
            Number(option.dataset.index) === pickerActive,
          );
        const active = $("project-choice").querySelector(
          `[data-index="${pickerActive}"]`,
        );
        $("project-filter").setAttribute("aria-activedescendant", active.id);
        if (
          !$("project-picker").classList.contains("hidden") &&
          active.scrollIntoView
        )
          active.scrollIntoView({ block: "nearest" });
      }
      function renderProjects() {
        const list = $("project-choice"),
          query = $("project-filter").value.trim().toLowerCase(),
          id = $("project_id").value.trim();
        list.replaceChildren();
        filteredProjects = remoteProjects.filter(
          (p) =>
            !query ||
            `${p.name} ${p.team_name} ${p.id}`.toLowerCase().includes(query),
        );
        for (const [index, project] of filteredProjects.entries()) {
          const option = text("button", "", "project-option");
          option.type = "button";
          option.id = "project-option-" + project.id;
          option.dataset.index = index;
          option.dataset.projectId = project.id;
          option.tabIndex = -1;
          option.disabled = pendingAction === "list-projects";
          option.setAttribute("role", "option");
          option.setAttribute("aria-selected", String(project.id === id));
          const labels = text("span", "", "project-option-labels");
          labels.append(
            text("span", project.name, "project-option-name"),
            text(
              "span",
              `${project.team_name} · ID ${project.id}`,
              "project-meta",
            ),
          );
          const mark = text(
            "span",
            project.id === id ? "✓" : "",
            "project-check",
          );
          mark.setAttribute("aria-hidden", "true");
          option.append(labels, mark);
          option.title = `${project.team_name} / ${project.name}（${project.id}）`;
          option.onclick = () => chooseProject(project);
          list.append(option);
        }
        if (pendingAction === "list-projects")
          $("project-list-status").textContent = "正在加载项目…";
        else if (projectListMessage)
          $("project-list-status").textContent = projectListMessage;
        else if (!projectsLoaded)
          $("project-list-status").textContent =
            "点开时自动加载项目，也可手动填写 ID。";
        else if (!remoteProjects.length)
          $("project-list-status").textContent =
            "当前账号没有可用的 API 项目，可刷新或手动填写 ID。";
        else
          $("project-list-status").textContent = filteredProjects.length
            ? `${filteredProjects.length} 个项目`
            : "没有匹配项目，请换个关键词。";
        highlightProject(
          Math.max(
            0,
            filteredProjects.findIndex((p) => p.id === id),
          ),
        );
      }
      function closeProjectPicker(restoreFocus = false) {
        $("project-picker").classList.add("hidden");
        $("project-trigger").setAttribute("aria-expanded", "false");
        if (restoreFocus) $("project-trigger").focus({ preventScroll: true });
      }
      function openProjectPicker() {
        $("project-manual").classList.add("hidden");
        $("project-filter").value = "";
        $("project-picker").classList.remove("hidden");
        $("project-trigger").setAttribute("aria-expanded", "true");
        renderProjects();
        $("project-filter").focus({ preventScroll: true });
        if (!projectsLoaded && pendingAction !== "list-projects")
          refreshProjects();
      }
      function refreshProjects() {
        if (busy) return;
        projectListMessage = "";
        send({ op: "list-projects" });
        renderProjects();
      }
      function chooseProject(project) {
        if (busy) return;
        const changed = $("project_id").value.trim() !== project.id;
        $("project_id").value = project.id;
        if (changed) {
          for (const key of [
            "endpoint_folder",
            "schema_folder",
            "branch",
            "module",
          ])
            $(key).value = "";
        }
        configDirty =
          configDirty ||
          changed ||
          project.name !== config.project_name ||
          project.team_name !== config.team_name;
        $("project-change-status").textContent = changed
          ? "同步项目已更改，保存后生效。目录、分支和模块设置已清空。"
          : "项目选择已更新，保存后生效。";
        $("project-change-status").classList.toggle("hidden", !configDirty);
        projectCaption();
        closeProjectPicker(true);
      }
      $("project-trigger").onclick = () => {
        $("project-picker").classList.contains("hidden")
          ? openProjectPicker()
          : closeProjectPicker(true);
      };
      $("load-projects").onclick = () => refreshProjects();
      $("project-filter").oninput = () => renderProjects();
      $("project-filter").onkeydown = (e) => {
        if (["ArrowDown", "ArrowUp", "Home", "End", "Enter"].includes(e.key)) {
          e.preventDefault();
          if (e.key === "Enter") {
            if (filteredProjects[pickerActive])
              chooseProject(filteredProjects[pickerActive]);
          } else
            highlightProject(
              e.key === "Home"
                ? 0
                : e.key === "End"
                  ? filteredProjects.length - 1
                  : pickerActive + (e.key === "ArrowDown" ? 1 : -1),
            );
        }
      };
      $("project-field").addEventListener("keydown", (e) => {
        if (
          e.key === "Escape" &&
          !$("project-picker").classList.contains("hidden")
        ) {
          e.preventDefault();
          e.stopPropagation();
          closeProjectPicker(true);
        }
      });
      document.addEventListener("pointerdown", (e) => {
        if (!$("project-field").contains(e.target)) closeProjectPicker();
      });
      $("project-field").addEventListener("focusout", (e) => {
        if (e.relatedTarget && !$("project-field").contains(e.relatedTarget))
          closeProjectPicker();
      });
      $("project-manual-toggle").onclick = () => {
        closeProjectPicker();
        $("project-manual").classList.remove("hidden");
        $("project_id").focus();
        $("project_id").select();
      };
      $("project-manual-done").onclick = () => {
        const id = $("project_id").value.trim();
        if (!/^\d+$/.test(id)) {
          status("请输入有效的数字项目 ID", true);
          $("project_id").focus();
          return;
        }
        $("project-manual").classList.add("hidden");
        $("project-trigger").focus();
      };
      $("project_id").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          $("project-manual-done").click();
        }
      });
      $("project_id").addEventListener("input", () => {
        if ($("project_id").value.trim() !== config.project_id)
          for (const key of [
            "endpoint_folder",
            "schema_folder",
            "branch",
            "module",
          ])
            $(key).value = "";
        projectCaption();
      });
      $("scan").onclick = () => send({ op: "scan", scope: "project" });
      $("search").oninput = () => viewList();
      for (const b of document.querySelectorAll("[data-tab]"))
        b.onclick = () => {
          for (const other of document.querySelectorAll("[data-tab]"))
            other.setAttribute("aria-selected", String(other === b));
          for (const id of ["model", "spec", "debug"])
            $(id).classList.toggle("hidden", id !== b.dataset.tab);
        };
      $("send").onclick = () => {
        try {
          const headers = JSON.parse($("headers").value || "{}");
          if (!headers || Array.isArray(headers) || typeof headers !== "object")
            throw Error("请求头必须是 JSON 对象");
          send({
            op: "debug",
            url: $("url").value,
            method: $("method").value,
            headers: Object.entries(headers).map(([k, v]) => [k, String(v)]),
            body: $("body").value,
          });
        } catch (e) {
          status(e.message, true);
        }
      };
      openidea.onMessage((raw) => {
        const v = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (v.clientId !== clientId) return;
        const contextReply = v.requestId === contextId;
        if (v.requestId !== pendingId && !contextReply) return;
        if (contextReply) contextId = null;
        const action = pendingAction;
        if (!contextReply) {
          pendingId = null;
          pendingAction = null;
          lock(false);
        }
        if (v.op === "config") {
          const changed = switchProject(v.projectRoot ?? null);
          if (changed || !configDirty || v.saved === true) applyConfig(v);
          if (changed) restoreProject();
          restoreSnapshot(v);
          if (changed && v.message) status(v.message);
        } else if (v.projectRoot !== projectRoot) return;
        if (contextReply) return;
        if (v.op === "projects") {
          remoteProjects = v.projects;
          projectsLoaded = true;
          projectListMessage = v.notices?.join(" ") || "";
          renderProjects();
          projectCaption();
        } else if (v.op === "scan") {
          renderScan(v.export, v.scannedAtMs, v.snapshotSaved === true, false);
          if (v.snapshotError)
            status("扫描完成，但本次结果未持久化：" + v.snapshotError, true);
        } else if (v.op === "response") {
          $("response").textContent = JSON.stringify(v.response, null, 2);
          status("请求完成，HTTP " + v.response.status);
        } else if (v.op === "error") {
          status(v.message, true);
          if (action === "list-projects") {
            projectListMessage = v.message;
            renderProjects();
          }
        } else if (v.op === "notice") status(v.message);
      });
      if (INITIAL && typeof INITIAL === "object") {
        projectRoot = INITIAL.projectRoot ?? null;
        applyConfig(INITIAL);
        restoreSnapshot(INITIAL);
        lock(false);
        if (INITIAL.snapshotAvailable) send({ op: "init" });
      } else send({ op: "init" });
      window.addEventListener("focus", checkContext);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkContext();
      });
      // API 1.9 没有项目切换事件；轻量查询宿主上下文覆盖同窗切换及恢复面板。
      window.setInterval(checkContext, 750);
    </script>
  </body>
</html>
