id = "jhzhang.apifox-helper"
name = "Apifox Helper for OpenIDEA"
version = "0.1.16"
description = "从 Java/Kotlin Spring、JAX-RS 源码生成 OpenAPI，预览嵌套响应模型，同步到 Apifox 并调试 HTTP 接口。"
authors = ["jhzhang"]
license = "Apache-2.0"
homepage = "https://github.com/jhzhang09/apifox-helper-openidea"
change-notes = "优化大项目扫描性能避免 CPU 预算超限，兼容 Java 文本块、现代类修饰符与 Spring 常见类型，未解析外部依赖类型支持确认后同步。"
icon = "icon.svg"
categories = ["tools", "frameworks"]
engines.openidea = "^1.9"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:apifox"]

[capabilities]
required = ["project.read", "project.write", "editor.read", "storage"]
optional = ["secrets", "clipboard", "net:api.apifox.com", "net:localhost", "net:127.0.0.1", "net:ask"]

[[contributes.secrets]]
name = "apifox_token"
label = "Apifox Access Token"
description = "Apifox 账号设置中的 API 访问令牌，由系统密钥库保存，用于 api.apifox.com 的项目查询和同步请求。"

[[contributes.secrets]]
name = "apifox_private_token"
label = "Apifox Private Access Token"
description = "仅用于手动配置的私有化 API 服务器；切换到其他私有化实例时请更换对应令牌。"

[[contributes.views]]
id = "apifox"
title = "Apifox Helper"
icon = "icon.svg"
location = "right"

[[contributes.commands]]
id = "open-panel"
title = "Apifox Helper: 打开接口侧栏"
category = "Apifox Helper"

[[contributes.commands]]
id = "configure"
title = "Apifox Helper: 配置同步项目"
category = "Apifox Helper"

[[contributes.commands]]
id = "export-openapi"
title = "Apifox Helper: 导出当前文件或目录的 OpenAPI"
category = "Apifox Helper"

[[contributes.commands]]
id = "export-project"
title = "Apifox Helper: 导出整个项目的 OpenAPI"
category = "Apifox Helper"

[[contributes.commands]]
id = "export-method"
title = "Apifox Helper: 导出光标所在接口的 OpenAPI"
category = "Apifox Helper"

[[contributes.commands]]
id = "upload"
title = "Apifox Helper: 同步当前文件或目录到 Apifox"
category = "Apifox Helper"

[[contributes.commands]]
id = "upload-method"
title = "Apifox Helper: 同步光标所在接口到 Apifox"
category = "Apifox Helper"

[[contributes.commands]]
id = "debug"
title = "Apifox Helper: 调试当前文件的接口"
category = "Apifox Helper"

[[contributes.menus]]
menu = "editor.context"
command = "open-panel"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "editor.context"
command = "export-openapi"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "editor.context"
command = "export-method"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "editor.context"
command = "upload"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "editor.context"
command = "upload-method"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "editor.context"
command = "debug"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "projectView.context"
command = "export-openapi"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "projectView.context"
command = "upload"
submenu = "Apifox Helper"

[[contributes.menus]]
menu = "projectView.context"
command = "open-panel"
submenu = "Apifox Helper"

[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt", "**/application.yml", "**/application.yaml", "**/application.properties"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["java", "kotlin"]
