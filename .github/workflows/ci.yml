name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: "1.100.0"
          target: wasm32-wasip2
          components: clippy, rustfmt
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Rust 回归与检查
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check
      - name: 侧栏与文档格式
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm test
      - name: 构建插件
        run: ./scripts/build.sh
      - name: 保存构建包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apifox-helper-openidea
          path: |
            dist/*.oiplugin
            dist/SHA256SUMS
          retention-days: 7
